name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lwc:
    name: Lint and LWC tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Lightning Web Components
        run: npm run lint

      - name: Run LWC unit tests
        run: npm run test:ci

  code-analyzer:
    name: Salesforce Code Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SF_AUTOUPDATE_DISABLE: "true"
      SF_DISABLE_TELEMETRY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@2.149.9

      - name: Install Salesforce Code Analyzer
        run: sf plugins install code-analyzer@5.16.0

      - name: Run Salesforce Code Analyzer
        id: code-analyzer
        uses: forcedotcom/run-code-analyzer@318e7429b49b97904dc41f7acbd41003db403965
        with:
          run-arguments: >-
            --workspace force-app
            --view detail
            --output-file sfca-results.html
            --output-file sfca-results.json
          results-artifact-name: salesforce-code-analyzer-results
