name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lwc:
    name: Lint and LWC tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Lightning Web Components
        run: npm run lint

      - name: Run LWC unit tests
        run: npm run test:ci

  code-analyzer:
    name: Salesforce Code Analyzer
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      SF_AUTOUPDATE_DISABLE: "true"
      SF_DISABLE_TELEMETRY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@2.149.9

      - name: Install Salesforce Code Analyzer
        run: sf plugins install code-analyzer@5.16.0

      - name: Run Salesforce Code Analyzer
        shell: bash
        run: |
          if ! sf code-analyzer run \
            --workspace force-app \
            --output-file "$RUNNER_TEMP/sfca-results.sarif" \
            >"$RUNNER_TEMP/sfca-output.log" 2>&1; then
            echo "::error::Salesforce Code Analyzer could not complete."
            exit 1
          fi

      - name: Upload results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          sarif_file: ${{ runner.temp }}/sfca-results.sarif
