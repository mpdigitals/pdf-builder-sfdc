name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lwc:
    name: Lint and LWC tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Lightning Web Components
        run: npm run lint

      - name: Run LWC unit tests
        run: npm run test:ci

  code-analyzer:
    name: Salesforce Code Analyzer
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      SF_AUTOUPDATE_DISABLE: "true"
      SF_DISABLE_TELEMETRY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Code Analyzer loads the project's ESLint configuration. Install the
      # locked dependencies so every configured engine can initialize and the
      # uploaded SARIF represents a complete analysis.
      - name: Install project dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@2.149.9

      - name: Install Salesforce Code Analyzer
        run: sf plugins install code-analyzer@5.16.0

      - name: Run Salesforce Code Analyzer
        shell: bash
        run: |
          if ! sf code-analyzer run \
            --workspace force-app \
            --rule-selector "Security:Recommended" \
            --output-file "$RUNNER_TEMP/sfca-results.sarif" \
            >"$RUNNER_TEMP/sfca-output.log" 2>&1; then
            echo "::error::Salesforce Code Analyzer could not complete."
            cat "$RUNNER_TEMP/sfca-output.log"
            exit 1
          fi

      - name: Sanitize SARIF for GitHub Code Scanning
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "sfca-results.sarif")

          with open(path, "r", encoding="utf-8") as f:
              sarif = json.load(f)

          removed = 0

          for run in sarif.get("runs", []):
              valid_results = []

              for result in run.get("results", []):
                  locations = result.get("locations", [])

                  has_artifact_location = any(
                      location
                      .get("physicalLocation", {})
                      .get("artifactLocation", {})
                      .get("uri")
                      for location in locations
                  )

                  if has_artifact_location:
                      valid_results.append(result)
                  else:
                      removed += 1

              run["results"] = valid_results

          with open(path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)

          print(f"Removed {removed} SARIF result(s) without artifact locations.")
          PY

      - name: Check for uploadable SARIF results
        id: sarif_results
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "sfca-results.sarif")

          with open(path, "r", encoding="utf-8") as f:
              sarif = json.load(f)

          result_count = sum(
              len(run.get("results", [])) for run in sarif.get("runs", [])
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"has_results={'true' if result_count else 'false'}\n")

          print(f"SARIF contains {result_count} uploadable result(s).")
          PY

      - name: Upload results to GitHub Code Scanning
        if: steps.sarif_results.outputs.has_results == 'true'
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          sarif_file: ${{ runner.temp }}/sfca-results.sarif
