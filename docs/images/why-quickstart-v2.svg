<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Why PDF Builder and Quick start</title><desc id="desc">Product benefits and five-step quick start.</desc>
<defs><linearGradient id="b"><stop stop-color="#eaf4ff"/><stop offset="1" stop-color="#d7eaff"/></linearGradient><linearGradient id="g"><stop stop-color="#e7fbf3"/><stop offset="1" stop-color="#d4f5e7"/></linearGradient><linearGradient id="y"><stop stop-color="#fff8df"/><stop offset="1" stop-color="#ffefbf"/></linearGradient><linearGradient id="p"><stop stop-color="#f3ecff"/><stop offset="1" stop-color="#e7dbff"/></linearGradient><linearGradient id="r"><stop stop-color="#fff0ef"/><stop offset="1" stop-color="#ffdedd"/></linearGradient><linearGradient id="check" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39b54a"/><stop offset="1" stop-color="#0a8f2d"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="338" rx="18" fill="#fff" stroke="#d8dee7"/><line x1="486" y1="28" x2="486" y2="312" stroke="#e6eaf0"/>
<text x="34" y="52" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1f2328">✨ Why PDF Builder?</text><text x="34" y="82" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#57606a">Everything you need to create professional, data-driven PDFs natively in Salesforce.</text>
<g font-family="Arial,Helvetica,sans-serif" fill="#24292f">
<g transform="translate(34 96)"><rect width="34" height="34" rx="7" fill="url(#check)"/><path d="M9 18l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="111" font-size="18" font-weight="700">100% Native Salesforce</text><text x="82" y="130" font-size="14.5" fill="#57606a">No external services or infrastructure</text>
<g transform="translate(34 146)"><rect width="34" height="34" rx="7" fill="url(#check)"/><path d="M9 18l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="161" font-size="18" font-weight="700">Works with any object</text><text x="82" y="180" font-size="14.5" fill="#57606a">Standard or custom Salesforce objects</text>
<g transform="translate(34 196)"><rect width="34" height="34" rx="7" fill="url(#check)"/><path d="M9 18l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="211" font-size="18" font-weight="700">Visual WYSIWYG editor</text><text x="82" y="230" font-size="14.5" fill="#57606a">Professional templates with drag &amp; drop design</text>
<g transform="translate(34 246)"><rect width="34" height="34" rx="7" fill="url(#check)"/><path d="M9 18l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="261" font-size="18" font-weight="700">Secure &amp; scalable</text><text x="82" y="280" font-size="14.5" fill="#57606a">Built entirely on Salesforce best practices</text>
<g transform="translate(34 296)"><rect width="34" height="34" rx="7" fill="url(#check)"/><path d="M9 18l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="82" y="311" font-size="18" font-weight="700">Seamless file management</text><text x="82" y="330" font-size="14.5" fill="#57606a">Save and version directly to Salesforce Files</text></g>
<text x="520" y="52" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1f2328">🚀 Quick start</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="520" y="96" width="94" height="94" rx="17" fill="url(#b)" stroke="#c8ddf5"/><path d="M567 119v31m0 0-11-11m11 11 11-11M545 161h44" fill="none" stroke="#0b5cab" stroke-width="4" stroke-linecap="round"/><text x="567" y="221" font-size="16" font-weight="700">1. Deploy</text><text x="630" y="149" font-size="26">→</text><rect x="648" y="96" width="94" height="94" rx="17" fill="url(#g)" stroke="#c7eadb"/><circle cx="682" cy="133" r="9" fill="#0a8f62"/><circle cx="708" cy="133" r="9" fill="#0a8f62"/><path d="M669 164c2-12 9-18 13-18s12 6 14 18M694 164c2-12 10-18 14-18s11 6 13 18" fill="none" stroke="#0a8f62" stroke-width="4"/><text x="695" y="221" font-size="16" font-weight="700">2. Assign</text><text x="695" y="242" font-size="13" fill="#57606a">permission set</text><text x="758" y="149" font-size="26">→</text><rect x="776" y="96" width="94" height="94" rx="17" fill="url(#y)" stroke="#efdba4"/><path d="M808 124h14c0-9 13-9 13 0v10h10c9 0 9 13 0 13h-10v15h-14v-10c-9 0-9-13 0-13v-15h-13z" fill="none" stroke="#8a6a12" stroke-width="4"/><text x="823" y="221" font-size="16" font-weight="700">3. Add</text><text x="823" y="242" font-size="13" fill="#57606a">component</text><text x="886" y="149" font-size="26">→</text><rect x="904" y="96" width="94" height="94" rx="17" fill="url(#p)" stroke="#dac8f5"/><path d="M931 118h27l15 15v37h-42zM958 118v16h15" fill="none" stroke="#6f4e9c" stroke-width="4"/><line x1="939" y1="150" x2="965" y2="150" stroke="#6f4e9c" stroke-width="3"/><line x1="939" y1="161" x2="962" y2="161" stroke="#6f4e9c" stroke-width="3"/><text x="951" y="221" font-size="16" font-weight="700">4. Import</text><text x="951" y="242" font-size="13" fill="#57606a">sample templates</text><text x="1014" y="149" font-size="26">→</text><rect x="1032" y="96" width="94" height="94" rx="17" fill="url(#r)" stroke="#f0c5c3"/><g transform="translate(1079 141) rotate(-42)"><path d="M0-25C12-18 18-6 18 8L8 17H-8L-18 8C-18-6-12-18 0-25Z" fill="none" stroke="#c23934" stroke-width="4"/><circle cy="-6" r="5" fill="none" stroke="#c23934" stroke-width="3"/><path d="M-8 15-15 27-3 20M8 15 15 27 3 20M0 18v13" fill="none" stroke="#c23934" stroke-width="4" stroke-linecap="round"/></g><text x="1079" y="221" font-size="16" font-weight="700">5. Generate</text><text x="1079" y="242" font-size="13" fill="#57606a">your first PDF</text></g></svg>